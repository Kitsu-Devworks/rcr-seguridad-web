<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCR Seguridad</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'rcr-gold': '#D4AF37',
                        'rcr-gold-light': '#F3E5AB',
                        'rcr-card': '#111111',
                        'rcr-border': '#222222'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-white font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="border-b border-rcr-border bg-black/80 backdrop-blur fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="text-xl font-black tracking-widest text-rcr-gold">
                RCR<span class="text-white">SEGURIDAD</span>
            </div>
            <a href="#contacto" class="border border-rcr-gold text-rcr-gold hover:bg-rcr-gold hover:text-black px-4 py-2 rounded text-xs font-bold uppercase tracking-wider transition-colors">
                Contacto
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow pt-28 pb-16 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto w-full">
        
        <!-- Hero Title -->
        <div class="text-center mb-12">
            <h1 class="text-3xl sm:text-5xl font-black uppercase tracking-tight mb-4">
                Solicitud de <span class="text-rcr-gold">Servicios</span>
            </h1>
            <p class="text-gray-400 text-sm sm:text-base max-w-xl mx-auto">
                Complete el formulario para coordinar evaluaciones en terreno, cobertura de guardias o soluciones de seguridad integral.
            </p>
        </div>

        <!-- Formulario de Contacto (Formspree) -->
        <section id="contacto">
            <form id="formContacto" action="https://formspree.io/f/xeelgkpa" method="POST" class="bg-rcr-card p-8 sm:p-12 border border-rcr-border rounded-xl space-y-6 shadow-2xl relative">
                
                <!-- Campo Honeypot para evitar spam -->
                <input type="text" name="_gotcha" class="hidden">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] uppercase tracking-widest text-rcr-gold font-bold block">Nombre o Razón Social</label>
                        <input type="text" name="nombre" required placeholder="Ej: Empresa / Juan Pérez" class="w-full bg-black border border-rcr-border p-4 rounded text-xs text-white focus:border-rcr-gold outline-none transition-colors">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] uppercase tracking-widest text-rcr-gold font-bold block">Correo Electrónico Operativo</label>
                        <input type="email" name="email" required placeholder="contacto@empresa.cl" class="w-full bg-black border border-rcr-border p-4 rounded text-xs text-white focus:border-rcr-gold outline-none transition-colors">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] uppercase tracking-widest text-rcr-gold font-bold block">Requerimiento de Servicio</label>
                    <textarea name="mensaje" required placeholder="Indique si requiere guardias acreditados, asesorías o servicios de drones..." class="w-full bg-black border border-rcr-border p-4 rounded text-xs text-white h-36 resize-none focus:border-rcr-gold outline-none transition-colors"></textarea>
                </div>

                <button type="submit" id="btnEnviar" class="w-full bg-rcr-gold hover:bg-rcr-gold-light text-black font-black py-4 rounded text-xs uppercase tracking-[0.3em] transition-colors shadow-lg cursor-pointer">
                    Enviar Requerimiento
                </button>
            </form>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-rcr-border py-8 text-center text-gray-600 text-xs">
        <p>&copy; RCR Seguridad. Todos los derechos reservados.</p>
    </footer>

    <!-- Script de procesamiento AJAX para evitar error 405 y redirecciones -->
    <script>
        document.getElementById('formContacto').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const button = document.getElementById('btnEnviar');
            const originalText = button.innerHTML;

            button.disabled = true;
            button.innerHTML = 'ENVIANDO...';

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    alert('Requerimiento enviado con éxito. Nos pondremos en contacto a la brevedad.');
                    form.reset();
                } else {
                    alert('Hubo un problema al procesar el envío. Por favor, intenta de nuevo o contáctanos directamente.');
                }
            } catch (error) {
                alert('Error de conexión. Revisa tu red e intenta nuevamente.');
            } finally {
                button.disabled = false;
                button.innerHTML = originalText;
            }
        });
    </script>

</body>
</html>
